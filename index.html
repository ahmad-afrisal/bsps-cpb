      }

      }

      .popup-card h3 {

        margin-bottom: 10px;
      }

      .slider {
        position: relative;
      }

      .slider img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
      }

      .btn-slide {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: white;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .prev {
        left: 10px;
      }

      .next {
        right: 10px;
      }

      .info-table {
        width: 100%;
        margin-top: 10px;

        padding: 4px;
        font-size: 13px;

      const map = L.map("map").setView([-2.764252, 118.845805], 14);

      // Pengukuran jarak
      L.control
        .polylineMeasure({
          position: "topleft",
          unit: "metres",
          showBearings: false,
          clearMeasurementsOnStop: false,
          showClearControl: true,
          showUnitControl: true,
        })
        .addTo(map);

      // OpenStreetMap
      const osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap",
        }
      );

      // Esri Satellite
      const satellite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri",
        }
      );

      // OpenTopoMap (Terrain)
      const terrain = L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 17,
          attribution: "&copy; OpenTopoMap",
        }
      );

      // Default layer
      satellite.addTo(map);

      // Layer Control
      const baseMaps = {
        "🗺️ Street Map": osm,
        "🛰️ Satellite": satellite,
        "⛰️ Terrain": terrain,
      };

      L.control.layers(baseMaps).addTo(map);

      // Data Tokok
      const tokoIcon = new L.Icon({
        iconUrl:
          "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
        shadowUrl:
          "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",

        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
      });

      const tokoLayer = L.layerGroup().addTo(map);

      dataToko.forEach((toko) => {
        L.marker([toko.lat, toko.lng], {
          icon: tokoIcon,
        })
          .bindPopup(
            `
      <div class="popup-card">
        <h3>🏪 ${toko.nama}</h3>
        <p>Toko Bangunan</p>
      </div>
    `
          )
          .addTo(tokoLayer);
      });

      const galleryState = {};

      dataWarga.forEach((item) => {
        galleryState[item.id] = {
          index: 0,
          photos: item.photos,
        };

        const popup = `
      <div class="popup-card">

      <div class="slider">

      <img
      id="img-${item.id}"
      src="${item.photos[0]}"
      >

      <button
      class="btn-slide prev"
      onclick="prevImage(${item.id})">
      ❮
      </button>

      <button
      class="btn-slide next"
      onclick="nextImage(${item.id})">
      ❯
      </button>

      </div>

      <h3>${item.nama}</h3>

      <table class="info-table">
      <tr>
      <td><b>NIK</b></td>
      <td>${item.nik}</td>
      </tr>

      <tr>
      <td><b>No KK</b></td>
      <td>${item.kk}</td>
      </tr>
      </table>

      </div>
      `;

        L.marker([item.lat, item.lng]).addTo(map).bindPopup(popup);
      });

      function nextImage(id) {
        let data = galleryState[id];

        data.index++;

        if (data.index >= data.photos.length) {
          data.index = 0;
        }

        document.getElementById(`img-${id}`).src = data.photos[data.index];
      }

      function prevImage(id) {
        let data = galleryState[id];

        data.index--;

        if (data.index < 0) {
          data.index = data.photos.length - 1;
        }

        document.getElementById(`img-${id}`).src = data.photos[data.index];
      }
